name: build-flutter
on:
  workflow_dispatch:
  push:
    paths: ['app/**', '.github/workflows/build-flutter.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate Android scaffolding
        run: |
          flutter --version
          flutter create --platforms=android --org sd.sanayei --project-name qareeb /tmp/gen
          rm -rf app/android && cp -r /tmp/gen/android app/android
      - name: Patch manifest, signing
        working-directory: app
        run: |
          python3 - <<'PY'
          import re,glob
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf8').read()
          s=re.sub(r'android:label="[^"]*"','android:label="صنايعي قريب"',s,count=1)
          perms='''<uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <queries>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="tel"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="mailto"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="twitter"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="snssdk1233"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="instagram"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="fb"/></intent>
                  <intent><action android:name="android.intent.action.PICK"/><data android:mimeType="image/*"/></intent>
              </queries>
              '''
          s=s.replace('<application',perms+'<application',1)
          s=s.replace('</application>','<meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="sq_alerts"/></application>',1)
          open(p,'w',encoding='utf8').write(s)
          print(s)
          PY
          cat >> android/build.gradle.kts <<'KTS'

          subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital") || name.startsWith("lintAnalyze") || name.startsWith("lintReport")) { enabled = false }
              }
          }
          KTS
          mkdir -p android/app/src/main/res/raw
          cp native/raw/*.ogg android/app/src/main/res/raw/
          cp native/MainActivity.kt android/app/src/main/kotlin/sd/sanayei/qareeb/MainActivity.kt
          cp ../android/test.keystore android/app/test.keystore
          cp google-services.json android/app/google-services.json
          python3 - <<'PY2'
          import re
          p='android/settings.gradle.kts'
          s=open(p).read()
          s=re.sub(r'(plugins\s*\{)', r'\1\n    id("com.google.gms.google-services") version "4.4.2" apply false', s, count=1)
          open(p,'w').write(s)
          p='android/app/build.gradle.kts'
          s=open(p).read()
          s=re.sub(r'(plugins\s*\{)', r'\1\n    id("com.google.gms.google-services")', s, count=1)
          open(p,'w').write(s)
          PY2
          cat >> android/app/build.gradle.kts <<'KTS'

          android {
              signingConfigs {
                  create("sq") {
                      storeFile = file("test.keystore")
                      storePassword = "sanayei-test"
                      keyAlias = "sanayei"
                      keyPassword = "sanayei-test"
                  }
              }
              buildTypes {
                  getByName("release") { signingConfig = signingConfigs.getByName("sq") }
              }
          }
          KTS
      - name: Deps, icons, analyze
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        working-directory: app
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: sanayei-native-apk, path: app/build/app/outputs/flutter-apk/*.apk }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk sanayei-qareeb-native.apk
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk sanayei-qareeb-native-32bit.apk
          gh release create "native-${{ github.run_number }}" sanayei-qareeb-native.apk sanayei-qareeb-native-32bit.apk --title "التطبيق الأصلي #${{ github.run_number }}" --notes "تطبيق أندرويد أصلي (Flutter) للتجربة."
