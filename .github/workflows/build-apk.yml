name: build-apk
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: sanayei-qareeb-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk sanayei-qareeb.apk
          gh release create "apk-${{ github.run_number }}" sanayei-qareeb.apk --title "APK للتجربة #${{ github.run_number }}" --notes "نسخة تجريبية قابلة للتثبيت على أندرويد."
