name: sanayei_qareeb
description: صنايعي قريب
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  image: ^4.2.0
  share_plus: ^10.0.2
  google_fonts: ^6.2.1
  firebase_core: any
  firebase_messaging: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: assets/icon-bg.png
  adaptive_icon_foreground: assets/icon-fg.png

flutter:
  uses-material-design: true
  assets:
    - assets/geo.json
    - assets/meta.json
    - assets/icon.png
    - assets/badges/
