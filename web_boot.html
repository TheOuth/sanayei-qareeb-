<style>
#sq-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#0F3A68,#2B8CF0);color:#fff;font-family:Tahoma,Arial,sans-serif;z-index:5;text-align:center;padding:24px}
#sq-boot img{width:92px;height:92px;border-radius:24px;background:#fff;padding:8px}
#sq-boot .sp{width:30px;height:30px;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sqs 0.9s linear infinite}
@keyframes sqs{to{transform:rotate(360deg)}}
#sq-boot button{background:#fff;color:#1F6FD0;border:0;border-radius:12px;padding:10px 22px;font-size:16px;font-weight:700;cursor:pointer}
#sq-boot small{opacity:.85;max-width:320px;word-break:break-word;direction:ltr}
</style>
<script>
(function () {
  // تنظيف أي Service Worker قديم من نسخة الموقع السابقة (كان يخزّن صفحات قديمة ويكسر التشغيل)
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        if (!rs.length) return;
        Promise.all(rs.map(function (r) { return r.unregister(); }))
          .then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : 0; })
          .then(function () { try { if (!sessionStorage.getItem('sq_swc')) { sessionStorage.setItem('sq_swc', '1'); location.reload(); } } catch (e) {} });
      });
    }
  } catch (e) {}
  var errs = [];
  window.addEventListener('error', function (e) { errs.push(String(e.message || e)); });
  window.addEventListener('unhandledrejection', function (e) { errs.push(String(e.reason)); });
  function hide() { var b = document.getElementById('sq-boot'); if (b) b.remove(); }
  var iv = setInterval(function () { if (document.querySelector('flt-glass-pane')) { setTimeout(hide, 1200); clearInterval(iv); } }, 300);
  setTimeout(function () {
    if (document.querySelector('flt-glass-pane') && !document.getElementById('sq-boot')) return;
    var b = document.getElementById('sq-boot'); if (!b) return;
    b.innerHTML = '<img src="icons/Icon-192.png" alt=""><div style="font-size:18px;font-weight:700">تعذّر تشغيل الصفحة</div><div style="opacity:.9;font-size:14px">جرّب تحديث الصفحة، وإن استمرت المشكلة أرسل لنا هذا النص:</div><small>' + (errs.slice(0, 3).join(' | ').replace(/</g, '&lt;') || 'no-error') + '</small><button onclick="location.reload()">إعادة المحاولة</button>';
  }, 25000);
})();
</script>
<!--BODY-->
<div id="sq-boot"><img src="icons/Icon-192.png" alt=""><div style="font-size:20px;font-weight:700">صنايعي قريب</div><div class="sp"></div></div>
